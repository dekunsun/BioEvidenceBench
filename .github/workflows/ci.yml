# Runs on every push and pull request:
#   1. the unit tests (pytest),
#   2. the freeze checks: every file frozen before the test pages were run (FREEZE.json) and before the
#      本草綱目 test set was prepared (data/bencao/FREEZE_bencao.json) must still have its recorded SHA-256.
# A failing freeze check means a frozen file was edited; changes after a freeze belong in DEVIATIONS.md.
# Dependencies come from requirements-lock.txt (exact versions), so a run is reproducible.
name: Freeze verified & tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-lock.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Freeze check (main evaluation)
        run: python src/freeze.py --verify
      - name: Freeze check (本草綱目 case)
        run: python src/bencao_freeze.py --verify

    TYPE LocaLity: Sandhills at the upper end of Bodega Bay, Sonoma County, California.\n\
    DISTRIBUTION: Coast and islands of California; apparently also in subalpine situations,\
    \ Nevada County, California, and on Vancouver Island.\n7. Achillea subalpina Greene,\
    \ Leaflets 1: 145. 1905.\nAchillea lanulosa alpicola Rydb. Mem. N. Y. Bot. Gard.\
    \ 1: 426. 1900.\nAchillea alpicola Rydb. Bull. Torrey Club 33: 157. 1906.\nAchillea\
    \ Millefolium alpicola Garrett, Spring Fl. Wasatch Reg. 101. 1911.\nA low perennial,\
    \ with a creeping rootstock; stem 1-3 dm. high, striate, sparingly villous, simple;\
    \ leaves 5-10 cm. long, 4-10 mm. wide, bipinnatifid, sparingly villous, the lower\
    \ linear, oblanceolate in outline and petioled, the upper sessile and linear;\
    \ primary divisions ovate in outline, short, usually ascending and crowded, the\
    \ ultimate ones lanceolate or lance-linear, spinulose-mucronate; heads not numerous,\
    \ in small congested, round-topped corymbs with short branches; involucre campanulate,\
    \ 3.5-4 mm. high and about 3 mm. broad, sparingly villous; bracts about 20, in\
    \ 4 series, the outer ovate, the inner elliptic, all obtuse and with darkbrown\
    \ or almost black margins; ray-flowers 5; ligules suborbicular, round-lobed, 2-3\
    \ mm. long, white or pinkish; disk-flowers 15-20; corollas yellowish-white, 2.5\
    \ mm. long; achenes 2 mm.\nlong, narrowly margined.\nTYPE LOCALITY: Subalpine\
    \ slopes of Mount Ouray, Colorado.\nDISTRIBUTION: High mountains, from Hudson\
    \ Bay and Alberta to New Mexico, California, British Columbia, and Yukon; Gasp\xE9\
    \ Peninsula, Quebec.\n8. Achillea laxiflora Pollard & Cockerell, Proc. Biol. Soc.\
    \ Wash. .\n15-9 S902: A stout perennial, with a rootstock; stem about 5 dm. high,\
    \ glabrous or sparingly villous; leaves coarsely pinnatifid, the upper 5-6 cm.\
    \ long, glabrous; divisions cleft or lobed; rachis conspicuously wing-margined;\
    \ ultimate divisions lance-linear, acute; heads numerous, in loose corymbs, long-peduncled;\
    \ involucre turbinate, about 8 mm. high and 6 mm. broad; bracts about 25, in 4\
    \ series, scarious, with green keel, the outer acutish, ovate, the inner obtuse\
    \ or rounded at the apex; ray-flowers about 5; ligules white, suborbicular, about\
    \ 5 mm. long; disk-flowers 40 or more; corollas 3 mm. long, yellowish-white; achenes\
    \ linear, prominently winged towards the apex.\nTYPE LOCALITY: Sandia Mountains,\
    \ New Mexico.\nDISTRIBUTION: New Mexico and northeastern Arizona.\n9. Achillea\
    \ californica Pollard, Bull. Torrey Club 26: 369. 1899.\nAchillea Millefolium\
    \ f. californica H. M. Hall, Univ. Calif. Publ. Bot. 3: 211. 1907.\nA robust perennial,\

- matched_name: ACHILLEA MILLEFOLIUM
  source: bhl
  source_id: 17572145
  taxon: Achillea millefolium
  text: '




    148. ACHILLEA MILLEFOLIUM L. Yarrow. Milfoil. (P. I. 2.) Stem erect, simple or
    branched above, glabrous or somewhat hairy, 1-3 feet high ; leaves alternate,
    all finely divided or dissected into narrow segments, those of the stem sessile.
    Heads small, numerous in a large compound flat-topped cluster; involucre egg-shaped,
    its bracts oblong, hairy, in a few overlapping rows; disk-flowers whitish, fertile;
    rays 4-6, white or pinkish. Achenes gray, wedge-shaped, about 1/12 inch long;
    pappus none. (Fig. 137.) Common in old fields, meadows, pastures and along roadsides.'
- matched_name: ACHILLEA MILLEFOLIUM
  source: bhl
  source_id: 17796465
  taxon: Achillea millefolium
  text: "\n\n Outer florets few in number, with an obcordate ray. Central florets\
    \ tubular; all either white or rose-coloured. Stamens five, syngenesious ; anthers\
    \ linear, and united in a sheath round the style. Style one, branched at top,\
    \ and having stigmas on the inner surface of the upper part. Ovary one. Fruit\
    \ an achene, without pappus. Receptacle flat. Involucre ovoid, imbricate. Inflorescence\
    \ dense, corymbose."

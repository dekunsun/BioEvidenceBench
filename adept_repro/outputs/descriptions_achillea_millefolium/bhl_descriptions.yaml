- matched_name: AcHILLEA MILLEFOLIUM; Achillea Pecten-Veneris
  source: bhl
  source_id: 710284
  taxon: Achillea millefolium
  text: "\n\nPlant of slender habit, 4 dm. or more in height, simple, the stem markedly\
    \ sulcate, loosely pubescent or villous ; leaves 8\u201412 cm. in length, oblanceolate\
    \ in general outline, regularly and finely bipinnatifid or bipinnate, the segments\
    \ as well as the ultimate divisions filiform, gradually reduced toward the base\
    \ of the rachis ; surface of the foliage obscurely pubescent with scattered hairs,\
    \ the somewhat clasping base of the petiole usually villous: corymb many-branched,\
    \ inclined to be flat-topped, the branches and branchlets puberulent: heads 4\u2014\
    5 mm. in height, the bracts of the involucre stramineous, carinate, each with\
    \ a dorsal greenish stripe : rays white, scarcely exceeding 2 mm. in length :\
    \ achenes narrowly elliptical, rather more broadly margined than in other members\
    \ of the subgenus: style much exserted.\n\n\n\nPlant of variable stature, usually\
    \ 3-6 dm. high, sparsely villous or glabrate; leaves of thin texture, evenly bipinnatifid,\
    \ the petiole with dilated clasping base; segments not closely approximated, the\
    \ ultimate divisions linear : corymb generally flat-topped, very compound, the\
    \ branchlets glabrate: involucral bracts pale stramineous with greenish keels:\
    \ rays usually small (2\u20143 mm.), white or pink : achenes linear, scarcely\
    \ margined."
- matched_name: Achillea Millefolium
  source: bhl
  source_id: 804766
  taxon: Achillea millefolium
  text: "\n\n\n\n4. Achillea Millefolium L. YARROW. MILFOIL. (I. F. f. 3983.) Perennial\
    \ from horizontal rootstocks; flowering stems sparsely pubescent, or nearly glabrous,\
    \ simple, or corymbosely branched above, 3-6 dm. high. Basal leaves and those\
    \ of the numerous short sterile shoots, mostly petioled, sometimes 25 cm.\n\n\n\
    \n long and I cm. wide, those of the stem sessile, all somewhat pubescent or nearly\
    \ glabrous; heads numerous, 4-6 mm. broad, in terminal compound dense, somewhat\
    \ convex corymbs; involucre ovoid, its bracts oblong, stramineous with greenish\
    \ keel, obtusish, pubescent ; rays 4-6, white, or often pink or purple. In various\
    \ situations in the east occurring as a naturalized weed. Native of Europe and\
    \ Asia. June-Nov."

  text: '


    Achillea millefolium L. Yarrow or Milfoil. WHerbage sparingly pubescent, green;
    stems erect, usually tufted, 30-90 cm. high; basal leaves short-petioled, oblong
    or oblong-lanceolate, 8-20 cm. long, pinnately divided into very numerous segments
    which are once or twice pinnately-cleft or parted into linear acute lobes; heads
    small, numerous, in convex or flat-topped terminal corymbs; involucre ovoid or
    subglobose, 3-5 mm. high; ray flowers 4 or 5, white, 2-4 mm. long. , .'

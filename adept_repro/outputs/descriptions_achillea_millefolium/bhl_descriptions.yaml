- matched_name: Achillea eradiata
  source: bhl
  source_id: 3330331
  taxon: Achillea millefolium
  text: '




    Perennial with a creeping rootstock; stems about 30 cm. high, corymbosely branched
    above, sulcate, sparsely villous; leaves green, sparsely villous, the lower ones
    5 cm. long, petioled from a broad scarious base, the upper ones 2-3 cm. long,
    sessile and but slightly broadened at base; lower leaves with 10-15 pairs of divisions,
    separated by about half their length, most of the divisions deeply 5-10 cleft;
    upper leaves less deeply divided, the rachis margined, the divisions merely lobed
    or cleft; inflorescence loose, composed of about 5 corymbiform branches 4-5 cm.
    long; heads cylindric-turbinate, 5-7 mm. long, 3-4 mm. broad; tegules about 20,
    elliptic-ovate, sparsely villous, all obtuse, greenish along the midrib, the scarious
    margins brown; flowers 3 mm. long, cream-colored, all tubular, the outer ones
    slightly larger, an occasional one developing into an imperfect ligule; akenes
    immature.'

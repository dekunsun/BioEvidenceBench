- matched_name: Leersia ciliata; Leersia hexandra
  source: bhl
  source_id: 11321112
  taxon: Leersia hexandra
  text: "\n\n1. Leersia hexandra, Sw. Prod. Veg. Ind. Occ. (1797) p. 181.\nPerennial\
    \ ; stems rooting in the mud, with floating flexuous branches several feet long,\
    \ sending up erect or ascending slender leafy branches 2-4 ft. high, usually slender\
    \ and weak, smooth, striate ; nodes hairy with deflexed hairs. Leaves 3-8 by 4-3\
    \ in., linear, tapering to a fine point, suberect, rather rigid, nearly glabrous,\
    \ with scaberulous margins, base narrow; sheaths nearly smooth, glabrous, the\
    \ margins eciliate ; ligule short, obliquely truncate or 2-lobed, membranous.\
    \ Panicle 2-4 in. long, pedunculate, oblong, laxly branched, narrow ; rhachis\
    \ filiform ; branches filiform, flexuous, angular, smooth. Spikelets nearly 1\
    \ in. long. Floral glume nearly } in. long, ovate-oblong, somewhat boat-shaped,\
    \ acute, shortly mucronate, strongly keeled, ciliate on the keel and margins,\
    \ 5-nerved, the lateral nerves forming a thickened margin; palea as long as the\
    \ glume, linear-lanceolate, subacute.\nFl. B. I. v. 7, p. 94; Trim. FI. Ceyl.\
    \ v. 5, p. 184; Woodr. in Journ. Bomb.\nNat. v. 18 (1901) p. 485; Prain, Beng.\
    \ Pl. p. 1185; Watt, Dict. Econ.\nProd. v. 4, p. 619. Leersia ciliata, Roxb. Fl.\
    \ Ind. v. 2 (1832) p. 207.\u2014 Flowers: Oct."
- matched_name: Leersia hexandra
  source: bhl
  source_id: 11454149
  taxon: Leersia hexandra
  text: "\n\nA slender grass 2-3 ft. high from a rooting geniculate base, nodes hairy.\
    \ Sheaths and leaves striate very scabrid, blade 3-12\u201D by -25-3\u201D, narrowed\
    \ at base, acuminate, ligule truncate. Panicle 2-4\u201D long with slender distant\
    \ branches -5-3\u201D long, often again branched, flexuous. Tip of pedicel not\
    \ much dilated. Spikelets -13--15\u201D long, green. Gl. iii 5-ribbed (including\
    \ the marginal) cymbiform with a short obtuse cusp; palea much more slender 3-nerved,\
    \ keel bristly.\nStamens 3 or 6 in the same inflorescence."
- matched_name: Homalocenchrus hexandrus
  source: bhl
  source_id: 16934517
  taxon: Leersia hexandra
  text: '




    3. Homalocenchrus hexandrus (Sw. ) Kuntze. Stems slender, weak, 6-10 dm. long,
    rooting at the lower nodes : leaves exceedingly rough ; blades flat, erect, 3-15
    cm. long, 3-6 mm. wide : panicle 4-8 cm. long, its branches ascending, 1.5-4 cm.
    long : spikelets 4-4.5 mm. long, 1.25-1.5 mm. broad, the keels strongly aculeate,
    the hairs increasing in length toward the apex, the surface of the scales hispidulous
    : stamens 6.'
- matched_name: Leersia hexandra
  source: bhl
  source_id: 17061995
  taxon: Leersia hexandra
  text: "\n\n5. L. hexandra, Swartz. Culms 2\xB0- 6\xB0 long, branching; leaves and\
    \ sheaths smooth or scabrous; panicle contracted, short branched, exserted ; spikelets\
    \ lanceolate, 2\u201D long; stamens 6.\u2014 Lakes and ponds, often in deep water,\
    \ Florida, and westward, near the coast."

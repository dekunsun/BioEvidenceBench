- matched_name: Oryza hexandra
  source: bhl
  source_id: 37151030
  taxon: Leersia hexandra
  text: '


    A scabrous aquatic perennial, the slender culms often 2 meters tall, erect from
    a creeping base, the flat blades mostly 15 to 20 cm. long and about 8 mm.

    wide, the many-flowered panicle pale or purplish. Extensively creeping stolons
    with short blades are sometimes produced in land bordering ponds and ditches.'
